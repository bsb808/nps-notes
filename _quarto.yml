project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "advising/**/*.qmd"
    - "thesis-prep/**/*.qmd"
  resources:
    - CNAME
    # Explicit: Quarto auto-copies assets it finds in markdown, but misses ones
    # referenced from raw HTML (e.g. the <video> tag in matlab-movies.qmd).
    - assets/

website:
  title: "NPS Notes — Brian Bingham"
  site-url: https://nps-notes.bbingham.dev
  repo-url: https://github.com/bsb808/nps-notes
  search: true               # a reference site is searched, not read through
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/bsb808/nps-notes
        aria-label: Source on GitHub

  # Categories live in the left sidebar, detail in the main column at right.
  # Keep this to two levels — category, then pages.
  sidebar:
    style: floating
    search: false
    contents:
      - section: "Advising"
        href: advising/index.qmd
        contents:
          - advising/working-with-me.qmd
          - advising/thesis-timeline.qmd
          - advising/second-reader.qmd
      - section: "Thesis Preparation"
        href: thesis-prep/index.qmd
        contents:
          - thesis-prep/technical-writing.qmd
          - thesis-prep/figures-for-writing.qmd
          - thesis-prep/matlab-movies.qmd
          - thesis-prep/presentation-guidelines.qmd
          - thesis-prep/final-draft-process.qmd
  page-footer:
    left: "© Brian Bingham · [Source on GitHub](https://github.com/bsb808/nps-notes)"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: flatly
    toc: true
    html-math-method: mathjax
    link-external-newwindow: true
    link-external-icon: true
    grid:
      body-width: 1400px       # default 800; raise the cap so wide monitors are used
      margin-width: 200px
      sidebar-width: 200px
